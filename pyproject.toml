[project]
name = "ship"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "ultralytics>=8.4.0",
    "opencv-python>=4.8.0",
    "pillow>=10.0.0",
    "matplotlib>=3.7.0",
    "torch>=2.7.0",
    "torchvision>=0.22.0",
    "streamlit>=1.62.0",
]

[tool.uv.workspace]
members = ["yolo-training"]

# PyTorch CUDA 12.8 index (for RTX 5080 / Blackwell support)
[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = [
  { index = "pytorch-cu128" },
]
torchvision = [
  { index = "pytorch-cu128" },
]

[tool.pytest.ini_options]
testpaths = ["tests"]
