# W&B Sweep Configuration — NSLSR Hyperparameter Optimization
#
# Searches over:
#   - Loss weights (box, cls, dfl)
#   - Augmentation parameters (scale, mosaic, mixup)
#   - Optimizer LR
#   - Preprocessing methods (tophat kernel, CLAHE clip)
#
# Usage:
#   uv run python scripts/sweep_train.py

program: ../scripts/sweep_train.py
method: bayes
metric:
  name: metrics/mAP50-95
  goal: maximize

parameters:
  # Loss weights
  box:
    values: [5.0, 6.0, 7.5, 9.0]
  cls:
    values: [0.3, 0.5, 0.7]
  dfl:
    values: [0.5, 1.0, 1.5]
  # fl_gamma removed — not supported in ultralytics 8.4.53

  # Augmentation
  scale:
    values: [0.2, 0.3, 0.5]
  mixup:
    values: [0.0, 0.1]
  mosaic:
    values: [0.5, 1.0]
  close_mosaic:
    values: [10, 15]

  # Optimizer
  lr0:
    min: 0.0005
    max: 0.002
  optimizer:
    values: ["AdamW", "SGD"]

  # Preprocessing (via --preprocess flag in sweep script)
  preprocessing:
    values: ["tophat_clahe", "tophat_detail", "dog_retinex", "none"]

  # Model
  model:
    values: ["yolo11m.pt", "yolo11s.pt"]

  # Training
  epochs:
    value: 100
  batch:
    values: [8, 16]
  imgsz:
    values: [640, 800]
