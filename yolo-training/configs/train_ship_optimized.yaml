# YOLO Training Configuration — Ship 9-Class Dataset (Optimized)
# Optimized for detecting 9 ship classes in 1024x512 synthetic IR imagery.
# Key challenge: 60K images, 9 classes, tiny objects (5-30 px).
#
# Changes from baseline train.yaml:
#   - imgsz: 1280 (upscale ships for better detection — they're tiny)
#   - Loss: focal gamma 1.5, lower box/dfl for small object tolerance
#   - Augment: mosaic + mixup + copy_paste retained (large dataset can absorb)
#              but scale reduced to 0.5 (vs 0.8) to preserve small objects
#   - Optimizer: AdamW with lower LR
#   - Batch: 32 (larger dataset supports larger batch)
#
# References:
#   - ultralytics small object detection guide
#   - Rybka et al. IR small ship detection
#   - CGSE-YOLOv5s (MDPI Sensors, 2025)

task: detect
mode: train

# Model
model: yolo11m.pt                     # Start from pretrained
# model: yolo11m_p2.yaml              # Uncomment for P2 detection head

# Training hyperparameters
epochs: 200
patience: 30
batch: 32                              # Larger batch for 60K image dataset
imgsz: 1280                            # Upscale to increase ship pixel footprint

# Optimizer
optimizer: AdamW
lr0: 0.001                             # Standard LR
lrf: 0.01
cos_lr: True
momentum: 0.937
weight_decay: 0.0005
warmup_epochs: 3.0
warmup_momentum: 0.8
warmup_bias_lr: 0.1

# Loss coefficients (small object tuned)
box: 5.0
cls: 0.5
dfl: 1.0
iou: 0.2

# Augmentation
# 60K dataset can handle moderate augmentation, but still protect small objects
mosaic: 1.0
close_mosaic: 15
mixup: 0.1                             # Mild mixup (reduced from 0.3)
copy_paste: 0.1                        # Mild copy-paste (reduced from 0.3)
scale: 0.5                             # Reduced from 0.8 for small objects
fliplr: 0.5
flipud: 0.0                            # Ship orientation is important
degrees: 5.0                           # Low rotation
translate: 0.2
shear: 3.0
perspective: 0.0
erasing: 0.0                           # Erasing destroys small ships
hsv_h: 0.03
hsv_s: 0.4
hsv_v: 0.3

# Checkpointing
save: True
save_period: 10
exist_ok: True
pretrained: True
verbose: True

# Validation
val: True
plots: True
