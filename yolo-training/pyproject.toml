[project]
name = "ship-yolo-training"
version = "0.1.0"
description = "YOLO training project for ship identification from IR imagery"
requires-python = ">=3.13"
dependencies = [
    "ultralytics>=8.4.0",
    "sahi>=0.11.0",
    "opencv-python>=4.9.0",
    "pillow>=10.0.0",
    "pyyaml>=6.0",
    "tqdm>=4.66.0",
    "numpy>=1.26.0",
    "matplotlib>=3.8.0",
    "wandb>=0.19.0",
    "pywavelets>=1.9.0",
]

[project.scripts]
train = "train:main"
predict = "predict:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
]
